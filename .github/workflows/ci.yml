# Runs on every pull request and on main. A release adds nothing to this beyond
# the cross-compiling, so a tag that passes here is a tag that publishes.
name: ci

on:
  push:
    branches: [main]
  pull_request:

# Nothing is granted by default, and the one job that runs the checks asks for
# what it needs. A job added later starts with nothing rather than inheriting
# the token this one reads with.
permissions: {}

jobs:
  check:
    runs-on: ubuntu-latest
    permissions:
      contents: read # to check the repository out
    steps:
      # Nothing here writes to the repository, so the token is not left behind
      # in .git/config for every later step and action to read.
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      # gofmt has no check mode: it lists the files it would change, and an
      # empty list is the pass.
      - name: Formatting
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "gofmt would rewrite these files; run gofmt -w ." >&2
            echo "$unformatted" >&2
            exit 1
          fi

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test ./...
